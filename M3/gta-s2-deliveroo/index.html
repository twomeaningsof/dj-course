<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA S2 Deliveroo - Obwodnica Warszafki</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: auto;
            padding: 20px;
        }

        #game-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0 auto;
        }

        canvas {
            background-color: #555;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 255, 255, 0.1),
                inset 0 0 20px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        #ui-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .panel {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
            border: 1px solid #444;
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #3498db;
        }

        #levels-container {
            max-height: 150px;
            overflow-y: auto;
        }

        kbd {
            background-color: #eee;
            border-radius: 3px;
            border: 1px solid #b4b4b4;
            box-shadow: 0 1px 1px rgba(0, 0, 0, .2), 0 2px 0 0 rgba(255, 255, 255, .7) inset;
            color: #333;
            display: inline-block;
            font-size: .85em;
            font-weight: 700;
            line-height: 1;
            padding: 2px 4px;
            white-space: nowrap;
            margin: 2px;
        }

        .level-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background: #34495e;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            text-align: left;
        }

        .level-btn:hover {
            background: #2980b9;
        }

        .level-btn.active {
            background: #27ae60;
            font-weight: bold;
        }

        #levels-container {
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 14px;
            color: #ccc;
        }

        .stat-val {
            color: #fff;
            font-weight: bold;
        }

        .restart-btn:hover {
            background: #2ecc71;
        }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #34495e;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            text-align: center;
        }

        .mode-btn:hover {
            background: #2980b9;
        }

        .collapsible-header {
            cursor: pointer;
            user-select: none;
            margin: 0;
            padding: 10px;
            background: #34495e;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .collapsible-header:hover {
            background: #2c3e50;
        }

        .toggle-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }

        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }

        .collapsible-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .collapsible-content.collapsed {
            max-height: 0;
            opacity: 0;
        }
    </style>
</head>

<body>

    <audio id="background-music" src="background.wav" loop></audio>

    <div id="ui-container">
        <div class="panel">
            <h3 class="collapsible-header" onclick="toggleSection('sterowanie')">
                <span class="toggle-icon" id="sterowanie-icon">▼</span> Sterowanie
            </h3>
            <div id="sterowanie-content" class="collapsible-content">
                <div><kbd>↑</kbd> Gaz</div>
                <div><kbd>↓</kbd> Wsteczny</div>
                <div><kbd>←</kbd> <kbd>→</kbd> Kierownica (Precyzyjna)</div>
                <div><kbd>Spacja</kbd> Hamulec</div>
            </div>
        </div>

        <div class="panel">
            <h3 class="collapsible-header" onclick="toggleSection('poziomy')">
                <span class="toggle-icon" id="poziomy-icon">▼</span> Poziomy
            </h3>
            <div id="poziomy-content" class="collapsible-content">
                <div id="levels-container">
                    <!-- Przyciski poziomów będą generowane tutaj dynamicznie -->
                </div>

                <div style="margin-top:15px; border-top: 1px solid #555; padding-top:10px;">
                    <div class="stat-row">Wybierz samochód:
                        <select id="car-selector" onchange="game.switchCar(this.value)">
                            <option value="standard" selected>Standard</option>
                            <option value="suv">SUV</option>
                            <option value="truck">Truck</option>
                        </select>
                    </div>
                </div>

                <div style="margin-top:15px; border-top: 1px solid #555; padding-top:10px;">
                    <div class="stat-row">Prędkość: <span class="stat-val" id="ui-speed">0 km/h</span></div>
                    <div class="stat-row">Skręt: <span class="stat-val" id="ui-steer">0°</span></div>
                    <div class="stat-row">Silnik: <span class="stat-val" id="ui-engine">ON</span></div>
                    <div class="stat-row">Światła: <span class="stat-val" id="ui-lights">ON</span></div>
                    <div class="stat-row">Poślizg: <span class="stat-val" id="ui-drift"
                            style="color: #3498db;">NIE</span></div>
                    <div class="stat-row">Boost: <span class="stat-val" id="ui-boost" style="color: #95a5a6;">0%</span>
                    </div>
                    <button class="mode-btn" id="toggle-steering-mode"
                        onclick="game.player.toggleSteeringMode()">Asystent Kierownicy: WŁ</button>
                    <button class="mode-btn" id="toggle-winter-mode" onclick="game.player.toggleWinterMode()">Poślizgi
                        Zimowe: WYŁ</button>
                    <button class="mode-btn" id="toggle-music-btn" onclick="game.toggleBackgroundMusic()">Dźwięk:
                        WŁ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script type="module" src="js/main.js"></script>

</body>

</html>
